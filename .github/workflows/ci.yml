name: CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'Directory.Build.props', 'Directory.Packages.props']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'Directory.Build.props', 'Directory.Packages.props']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IronHive.Flux.slnx

      - name: Build
        run: dotnet build IronHive.Flux.slnx --no-restore -c Release

      - name: Test
        run: dotnet test tests/IronHive.Flux.Tests --no-build -c Release --logger "trx;LogFileName=test-results.trx"

