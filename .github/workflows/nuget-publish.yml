name: NuGet Publish

on:
  push:
    branches: [main]
    paths: ['Directory.Build.props']
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish even if version exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

  build-and-test:
    needs: detect-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IronHive.Flux.slnx

      - name: Build
        run: dotnet build IronHive.Flux.slnx --no-restore -c Release

      - name: Test
        run: dotnet test tests/IronHive.Flux.Tests --no-build -c Release --hangdump --hangdump-timeout 5m

  publish:
    needs: [detect-version, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget-production

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IronHive.Flux.slnx

      - name: Build
        run: dotnet build IronHive.Flux.slnx --no-restore -c Release

      - name: Check existing versions on NuGet
        id: check
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          # Derived from the solution, not a hand-kept list. The list used to name three packages, so a
          # version where those three existed and the rest did not was read as "already published" and
          # skipped — which is how IronHive.Tools.SystemHarness and IronHive.Tools.WebLookup stayed
          # unpublished while every run reported success.
          # Assumes PackageId matches the csproj filename, which holds in this repository (verified).
          # If a project ever declares a differing PackageId, read it from the csproj instead — a
          # mismatch here would report a package as missing when it was in fact produced, and a gate
          # that cries wolf gets ignored.
          PACKAGES=($(grep -oP '(?<=Path=")src/[^"]+\.csproj' IronHive.Flux.slnx | xargs -n1 basename | sed 's/\.csproj$//'))
          NEED_PUBLISH=false

          for PACKAGE in "${PACKAGES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE,,}/${VERSION}/${PACKAGE,,}.${VERSION}.nupkg")
            if [ "$STATUS" != "200" ]; then
              echo "$PACKAGE $VERSION not found on NuGet (status: $STATUS)"
              NEED_PUBLISH=true
            else
              echo "$PACKAGE $VERSION already exists on NuGet"
            fi
          done

          if [ "${{ inputs.force_publish }}" == "true" ]; then
            NEED_PUBLISH=true
            echo "Force publish enabled"
          fi

          echo "need_publish=$NEED_PUBLISH" >> $GITHUB_OUTPUT

      # Pack the solution, not a name-matched subset. The previous glob was src/*/IronHive.Flux*.csproj,
      # which silently excluded IronHive.Tools.SystemHarness and IronHive.Tools.WebLookup — both packable,
      # both shipped in this repo, neither ever published. Nothing failed, because a package that is never
      # produced cannot fail to push; the gap was only visible to someone looking for it on nuget.org.
      - name: Pack
        if: steps.check.outputs.need_publish == 'true'
        run: dotnet pack IronHive.Flux.slnx --no-build -c Release -o ./nupkgs

      - name: Verify packages
        if: steps.check.outputs.need_publish == 'true'
        run: |
          ls -la ./nupkgs/
          # Fail here rather than let a consumer discover a missing package. The list is derived from the
          # solution, so adding a packable project cannot quietly fall out of the release.
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          missing=0
          # Assumes PackageId matches the csproj filename, which holds in this repository (verified).
          # If a project ever declares a differing PackageId, read it from the csproj instead — a
          # mismatch here would report a package as missing when it was in fact produced, and a gate
          # that cries wolf gets ignored.
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' IronHive.Flux.slnx); do
            id=$(basename "$csproj" .csproj)
            if [ ! -f "./nupkgs/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Publish to NuGet
        if: steps.check.outputs.need_publish == 'true'
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Create Git tag
        if: steps.check.outputs.need_publish == 'true'
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          TAG="v${VERSION}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          else
            echo "Tag $TAG already exists"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.need_publish == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: v${{ needs.detect-version.outputs.version }}
          body: |
            ## IronHive.Flux v${{ needs.detect-version.outputs.version }}

            ### Packages
            - [IronHive.Flux.Core](https://www.nuget.org/packages/IronHive.Flux.Core/${{ needs.detect-version.outputs.version }})
            - [IronHive.Flux.Rag](https://www.nuget.org/packages/IronHive.Flux.Rag/${{ needs.detect-version.outputs.version }})
            - [IronHive.Flux.WebLookup](https://www.nuget.org/packages/IronHive.Flux.WebLookup/${{ needs.detect-version.outputs.version }})
            - [IronHive.Tools.SystemHarness](https://www.nuget.org/packages/IronHive.Tools.SystemHarness/${{ needs.detect-version.outputs.version }})
            - [IronHive.Tools.WebLookup](https://www.nuget.org/packages/IronHive.Tools.WebLookup/${{ needs.detect-version.outputs.version }})
            - [IronHive.Flux](https://www.nuget.org/packages/IronHive.Flux/${{ needs.detect-version.outputs.version }}) (metapackage)
          prerelease: ${{ contains(needs.detect-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
